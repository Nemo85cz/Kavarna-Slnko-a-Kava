  <main class="container page contact-layout">
    <section>
      <h1>Kontakt</h1>
      <p><strong>Adresa:</strong> Václavské náměstí 12, Praha</p>
      <p><strong>Telefon:</strong> +420 123 456 789</p>

          <input type="email" name="email" />

        <label>Zpráva
